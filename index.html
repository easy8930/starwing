<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>STARWING — ローカルシューティング</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#17294a 0%,#070c18 65%);color:#dceaff;font:15px system-ui,sans-serif;display:grid;min-height:100vh;place-items:center}main{width:min(1100px,96vw)}header{display:flex;align-items:center;justify-content:space-between;margin:20px 0}h1{font-size:24px;letter-spacing:6px;margin:0}small{color:#8295b5}button{background:#14243d;color:#cceaff;border:1px solid #335476;border-radius:6px;padding:10px 18px;cursor:pointer}canvas{display:block;width:100%;background:#060b18;border:1px solid #3e6383;border-radius:12px;box-shadow:0 24px 80px #0009,0 0 40px #249bdb12}footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;line-height:2;margin:14px 0;color:#9fb3cc}kbd{color:white;background:#20324d;padding:3px 6px;border-radius:4px}
html{min-height:100%;overscroll-behavior:none}body{min-height:100svh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}button{min-height:44px;touch-action:manipulation}canvas{height:auto}.mobile-controls{display:none;align-items:center;justify-content:space-between;gap:16px;padding:10px 14px;user-select:none;-webkit-user-select:none}.touch-help{display:none;color:#a8c2dd;font-size:12px;margin:7px 0}.stick{width:130px;height:130px;flex:0 0 130px;border-radius:50%;position:relative;touch-action:none;background:radial-gradient(circle,#274963aa,#0d1a31);border:1px solid #456781;box-shadow:inset 0 0 24px #05101e}.stick:before{content:'＋';position:absolute;inset:0;display:grid;place-items:center;font-size:55px;color:#82b0c83b}.knob{position:absolute;left:calc(50% - 25px);top:calc(50% - 25px);width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#98d7ed,#2a6188);box-shadow:0 5px 15px #0007;pointer-events:none}.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;max-width:240px}.actions button{font-weight:bold;min-width:100px}.actions .power{background:#b97529;color:#fff4df;border-color:#ffbd62}.actions .power:disabled{background:#243246;color:#8da1ba;border-color:#3b4c60}.mobile-controls button{touch-action:none}
@media (pointer:coarse),(max-width:760px){.mobile-controls{display:flex}.touch-help{display:block}header{margin:8px 0}h1{font-size:19px}small{font-size:10px}footer{font-size:11px;line-height:1.7;margin:7px 0}footer span:first-child{display:none}main{width:96vw}.actions{max-width:220px}}
@media (orientation:landscape) and (max-height:600px) and (pointer:coarse){body{display:flex;justify-content:center}main{width:100%;position:relative}header{position:absolute;right:12px;top:38px;z-index:3;margin:0}header>div{display:none}header button{font-size:11px;opacity:.75;padding:4px 10px;min-height:34px}canvas{width:auto;height:min(100svh,56vw);max-width:100%;margin:auto;border-radius:0}.mobile-controls{position:absolute;inset:0;pointer-events:none;align-items:flex-end;padding:0 18px 42px}.mobile-controls>*{pointer-events:auto}.stick{width:105px;height:105px;flex-basis:105px;opacity:.65}.actions{max-width:220px;opacity:.85}.actions button{min-width:90px;font-size:12px;padding:6px}.touch-help,footer{display:none}}
.audio-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0;color:#a8c2dd;font-size:12px}.audio-controls input{width:85px;min-height:32px;accent-color:#70dfef}.audio-controls button{padding:6px 12px}.audio-controls label{display:flex;align-items:center;gap:6px}@media (orientation:landscape) and (max-height:600px) and (pointer:coarse){.audio-controls{position:absolute;top:38px;left:12px;z-index:4;margin:0;gap:4px}.audio-controls button{min-height:34px;padding:4px 8px}.audio-controls input{width:65px}.audio-hint{display:none}}
dialog#results{color:#dceaff;background:linear-gradient(145deg,#162941,#080f20);border:1px solid #5a87a8;border-radius:16px;width:min(440px,94vw);max-height:90svh;overflow:auto;padding:20px;box-shadow:0 20px 80px #000b}#results::backdrop{background:#020712b8}#results h2{margin:0 0 8px;letter-spacing:3px}#results p{margin:8px 0;font-size:13px}#results table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin:12px 0}#results th,#results td{padding:5px 8px;text-align:left;border-bottom:1px solid #29415a}#results td:last-child,#results th:last-child{text-align:right}#results tr.current{background:#26516a;color:#ffe1a0}#results input{width:130px;padding:10px;font:20px monospace;letter-spacing:4px;text-transform:uppercase;background:#091526;color:white;border:1px solid #72b5ce;border-radius:6px}#results form{padding:12px;background:#203c50;border-radius:8px}#results .result-actions{display:flex;gap:8px;justify-content:flex-end}#rank-error{color:#ffbc9d}#results [hidden]{display:none}
</style><main><header><div><h1>STARWING</h1><small>TWO STAGES EDITION / SAFARI AUDIO FIX 2</small></div><button id="start">開始 / リトライ</button></header><div class="audio-controls"><button id="sound" aria-pressed="true">音 ON</button><button id="audio-retry">音を再開・テスト</button><label for="volume">音量 <input id="volume" type="range" min="0" max="100" value="30"><output id="volume-value" for="volume">30%</output></label><span class="audio-hint"><span id="audio-status" role="status">開始するとBGM・効果音が流れます</span></span></div><canvas id="screen" width="1000" height="560" aria-label="横スクロールシューティングゲーム"></canvas><p class="touch-help">横持ち推奨 ｜ 左パッドで移動・自動連射 ｜ カプセル取得後に「強化」</p><div class="mobile-controls"><div class="stick" id="stick" role="group" aria-label="移動パッド"><div class="knob" id="knob"></div></div><div class="actions"><button class="power" id="power" disabled>強化 —</button><button id="pause">一時停止</button><button id="auto" aria-pressed="true">自動連射 ON</button></div></div><footer><span><kbd>↑↓←→</kbd> / WASD 移動　<kbd>Z</kbd> / Space 連射　<kbd>X</kbd> 強化　<kbd>P</kbd> 一時停止</span><span>同じ武器を再取得でLv.3まで進化。DOUBLE／LASERは切替式（強化段階を保持）。</span></footer></main><dialog id="results" aria-labelledby="result-title"><h2 id="result-title">BEST 10</h2><p id="result-score"></p><form id="name-form" hidden novalidate><p><strong>NEW HIGH SCORE!</strong></p><label for="rank-name">名前（アルファベット1〜5文字）</label><p><input id="rank-name" maxlength="5" minlength="1" pattern="[A-Za-z]{1,5}" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="rank-error" required> <button type="submit">登録</button></p><p id="rank-error" role="alert"></p></form><table><thead><tr><th>順位</th><th>名前</th><th>スコア</th></tr></thead><tbody id="rank-rows"></tbody></table><p id="rank-storage">このブラウザーの記録です。未登録の名前はGUESTで表示します。</p><div class="result-actions"><button id="rank-close">閉じる</button><button id="rank-retry">もう一度遊ぶ</button></div></dialog><script>
'use strict';
const canvas=document.getElementById('screen'),g=canvas.getContext('2d'),keys={};
let stage=1,stageIntro=0;
let state='title',time=0,score=0,lives=3,charge=0,shotCD=0,spawnCD=0,boss=null,bossMade=false,player,shots=[],enemies=[],bullets=[],caps=[],particles=[],history=[],best=0;
const results=document.getElementById('results'),nameForm=document.getElementById('name-form'),nameInput=document.getElementById('rank-name');
let ranking=[],currentRecord=null,rankingShown=false,storageOK=true;
try{
 const saved=JSON.parse(localStorage.getItem('starwing-ranking-v1')||'[]');
 if(Array.isArray(saved))ranking=saved.filter(r=>r&&Number.isSafeInteger(r.score)&&r.score>0&&typeof r.name==='string'&&/^[A-Z]{1,5}$/.test(r.name)).map(r=>({name:r.name,score:r.score})).sort((a,b)=>b.score-a.score).slice(0,10);
 const old=Number(localStorage.getItem('starwing-best'));
 if(Number.isSafeInteger(old)&&old>0&&(!ranking.length||old>ranking[0].score))ranking.unshift({name:'GUEST',score:old});
 ranking=ranking.slice(0,10);best=ranking[0]?.score||0;
}catch{storageOK=false;}
function saveRanking(){try{localStorage.setItem('starwing-ranking-v1',JSON.stringify(ranking));localStorage.setItem('starwing-best',String(best));}catch{storageOK=false;}document.getElementById('rank-storage').textContent=storageOK?'このブラウザーの記録です。未登録の名前はGUESTで表示します。':'保存できないため、記録はこのページを開いている間だけ保持されます。';}
function renderRanking(){const rows=document.getElementById('rank-rows');rows.replaceChildren();for(let i=0;i<10;i++){const r=ranking[i],tr=document.createElement('tr');if(r===currentRecord)tr.className='current';for(const value of [String(i+1).padStart(2,'0'),r?r.name:'—',r?r.score.toLocaleString():'—']){const td=document.createElement('td');td.textContent=value;tr.appendChild(td);}rows.appendChild(tr);}}
function showResults(){
 if(rankingShown)return;rankingShown=true;const record=score>best;
 currentRecord=score>0?{name:'GUEST',score}:null;
 if(currentRecord){ranking.push(currentRecord);ranking.sort((a,b)=>b.score-a.score);ranking=ranking.slice(0,10);}best=Math.max(best,score);
 nameForm.hidden=!record;nameInput.value='';document.getElementById('rank-error').textContent='';
 document.getElementById('result-title').textContent=state==='clear'?'SECTOR CLEAR · BEST 10':'GAME OVER · BEST 10';document.getElementById('result-score').textContent='今回のスコア：'+score.toLocaleString();
 saveRanking();renderRanking();results.showModal();if(record)nameInput.focus();
}
nameForm.addEventListener('submit',e=>{e.preventDefault();const name=nameInput.value.toUpperCase();if(!/^[A-Z]{1,5}$/.test(name)){document.getElementById('rank-error').textContent='A〜Zのアルファベットを1〜5文字入力してください。';nameInput.focus();return;}if(currentRecord)currentRecord.name=name;saveRanking();renderRanking();nameForm.hidden=true;document.getElementById('rank-close').focus();});
document.getElementById('rank-close').onclick=()=>results.close();document.getElementById('rank-retry').onclick=()=>reset();

const stars=Array.from({length:100},()=>({x:Math.random()*1000,y:Math.random()*560,z:Math.random()*2+.3}));
const names=['SPEED','MISSILE','DOUBLE','LASER','OPTION','SHIELD'];
function reset(){stage=1;stageIntro=0;if(results.open)results.close();rankingShown=false;currentRecord=null;blasts=[];debris=[];blastQueue=[];shake=0;victory=0;sound.unlock();sound.restart();releaseStick();time=0;score=0;lives=3;charge=0;shotCD=0;spawnCD=1;boss=null;bossMade=false;shots=[];enemies=[];bullets=[];caps=[];particles=[];history=[];player={x:140,y:280,speed:0,missile:0,double:0,laser:0,option:0,weapon:"normal",shield:0,inv:2};state='play'}
const stick=document.getElementById('stick'),knob=document.getElementById('knob'),powerButton=document.getElementById('power'),pauseButton=document.getElementById('pause'),autoButton=document.getElementById('auto');
let touchX=0,touchY=0,stickPointer=null,autoFire=matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0;
function releaseStick(){touchX=touchY=0;stickPointer=null;knob.style.transform='translate(0px,0px)'}
function moveStick(e){if(e.pointerId!==stickPointer)return;const r=stick.getBoundingClientRect(),radius=r.width*.32;let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,len=Math.hypot(x,y);if(len>radius){x*=radius/len;y*=radius/len}touchX=Math.abs(x)<4?0:x/radius;touchY=Math.abs(y)<4?0:y/radius;knob.style.transform=`translate(${x}px,${y}px)`}
stick.addEventListener('pointerdown',e=>{if(stickPointer!==null)return;e.preventDefault();stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer){e.preventDefault();moveStick(e)}});
for(const type of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(type,e=>{if(e.pointerId===stickPointer)releaseStick()});
function togglePause(){sound.unlock();sound.quiet();if(state==='play')state='pause';else if(state==='pause'){state='play';sound.unlock();}releaseStick();syncControls()}
function syncControls(){powerButton.disabled=state!=='play'||!charge;powerButton.textContent=charge?'強化 '+names[charge-1]:'強化 —';pauseButton.textContent=state==='pause'?'再開':'一時停止';pauseButton.disabled=state!=='play'&&state!=='pause';autoButton.textContent='自動連射 '+(autoFire?'ON':'OFF');autoButton.setAttribute('aria-pressed',String(autoFire))}
powerButton.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='play'){upgrade();syncControls()}});
pauseButton.onclick=togglePause;autoButton.onclick=()=>{autoFire=!autoFire;syncControls()};
document.addEventListener('visibilitychange',()=>{if(document.hidden){sound.quiet();releaseStick();Object.keys(keys).forEach(k=>delete keys[k]);if(state==='play')state='pause';syncControls()}});
addEventListener('resize',releaseStick);
document.getElementById('start').onclick=reset;
addEventListener('keydown',e=>{if(results.open)return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.repeat)return;if(e.code==='Enter'&&state!=='play')reset();if(e.code==='KeyP')togglePause();if(e.code==='KeyX'&&state==='play')upgrade()});
addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>{sound.quiet();releaseStick();Object.keys(keys).forEach(k=>delete keys[k]);if(state==='play')state='pause'});
function upgrade(){if(!charge)return;sound.effect('upgrade');switch(charge){case 1:player.speed=Math.min(3,player.speed+1);break;case 2:player.missile=Math.min(3,player.missile+1);break;case 3:player.double=Math.min(3,player.double+1);player.weapon="double";break;case 4:player.laser=Math.min(3,player.laser+1);player.weapon="laser";break;case 5:player.option=Math.min(3,player.option+1);break;case 6:player.shield=3;break}charge=0}
let blasts=[],debris=[],blastQueue=[],shake=0,victory=0;
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
function detonate(x,y,scale=1){
  blasts.push({x,y,scale,age:0,life:.55+scale*.12});
  shake=Math.max(shake,Math.min(6,scale*2));
  burst(x,y,'#ffc16c',Math.round(20*scale));
  for(let i=0;i<Math.round(8*scale);i++){const a=Math.random()*Math.PI*2,v=70+Math.random()*160;debris.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,angle:a,spin:(Math.random()-.5)*12,size:2+Math.random()*4*scale,life:.6+Math.random()*.55});}
  if(blasts.length>24)blasts.splice(0,blasts.length-24);
  if(debris.length>180)debris.splice(0,debris.length-180);
  if(particles.length>500)particles.splice(0,particles.length-500);
}
function bossDetonation(x,y){
  detonate(x,y,2);victory=1.65;
  for(let i=0;i<7;i++){const a=i*2.4;blastQueue.push({delay:.12+i*.14,x:x+Math.cos(a)*55,y:y+Math.sin(a)*45,scale:1.3});}
  blastQueue.push({delay:1.15,x,y,scale:3});
}
function updateFX(dt){
  shake=Math.max(0,shake-dt*14);
  for(const q of blastQueue){q.delay-=dt;if(q.delay<=0&&!q.done){q.done=true;detonate(q.x,q.y,q.scale);sound.effect('explode');}}
  blastQueue=blastQueue.filter(q=>!q.done);
  for(const b of blasts)b.age+=dt;blasts=blasts.filter(b=>b.age<b.life);
  for(const d of debris){d.x+=d.vx*dt;d.y+=d.vy*dt;d.vx*=Math.exp(-dt*1.8);d.vy+=45*dt;d.angle+=d.spin*dt;d.life-=dt;}debris=debris.filter(d=>d.life>0);
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}particles=particles.filter(p=>p.life>0);
}
function drawFX(){
  g.save();g.globalCompositeOperation='lighter';
  for(const b of blasts){const progress=b.age/b.life,r=(8+progress*65)*b.scale,alpha=1-progress;
    g.globalAlpha=alpha*.75;glow(b.x,b.y,r,'#ff8529');
    g.strokeStyle='#ffc16b';g.lineWidth=Math.max(1,4*(1-progress));g.beginPath();g.arc(b.x,b.y,r,0,Math.PI*2);g.stroke();
    if(b.age<.15){g.globalAlpha=(1-b.age/.15)*(reducedMotion.matches?.3:.9);glow(b.x,b.y,24*b.scale,'#fff5d6');}
  }
  g.globalCompositeOperation='source-over';
  for(const d of debris){g.save();g.globalAlpha=Math.min(1,d.life*2);g.translate(d.x,d.y);g.rotate(d.angle);g.fillStyle=d.life>.7?'#ffce83':'#8798ad';g.fillRect(-d.size/2,-d.size/3,d.size,d.size*.65);g.restore();}g.restore();
}
function burst(x,y,color,n=18){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=Math.random()*180+30;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5+Math.random()*.4,color})}}
function hit(){if(player.inv>0||state!=='play')return;sound.effect('damage');burst(player.x,player.y,'#7ceaff');player.inv=2;if(player.shield>0){player.shield--;return}lives--;if(lives<=0){finish('over');return}player.x=140;player.y=280;player.speed=Math.max(0,player.speed-1);bullets=[]}
function finish(s){if(state==='clear'||state==='over')return;state=s;sound.effect(s);showResults()}
function optionPosition(i){const p=history[Math.min(history.length-1,(i+1)*12)]||player;return {x:Math.max(24,p.x-35-(i*23)),y:Math.max(65,Math.min(475,p.y+(i%2?20:-20)))}}
function fire(x,y,aux=false){
 const laser=player.weapon==='laser'?player.laser:0,spread=player.weapon==='double'?player.double:0;
 shots.push({x:x+20,y,vx:700,vy:0,r:laser?3+laser*2:3,damage:laser?1+laser:1,len:laser?45+laser*25:17,kind:laser?'laser':'shot',life:2});
 if(spread)for(let i=1;i<=spread;i++)for(const side of [-1,1])shots.push({x:x+10,y:y+side*8,vx:570,vy:side*(90+i*65),r:3,damage:1,len:17,life:2});
 if(player.missile&&!aux){const lv=player.missile;for(let i=0;i<(lv===3?2:1);i++)shots.push({x,y:y+(i?-12:12),vx:280,vy:i?-90:90,r:4+lv*.4,damage:2+lv,len:14,kind:'missile',level:lv,life:3});}
}
function enemyBullet(x,y,speed,offset=0){let a=Math.atan2(player.y-y,player.x-x)+offset;bullets.push({x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,r:5})}
function nextStage(){stage=2;time=0;stageIntro=3;boss=null;bossMade=false;enemies=[];bullets=[];shots=[];caps=[];history=[];blasts=[];debris=[];particles=[];blastQueue=[];shake=0;spawnCD=1;shotCD=0;player.x=140;player.y=280;player.inv=3;releaseStick();sound.restart();}
function update(dt){if(stageIntro>0){stageIntro=Math.max(0,stageIntro-dt);return;}if(victory>0){victory=Math.max(0,victory-dt);if(!victory){if(stage===1)nextStage();else finish('clear')};return;}time+=dt;player.inv=Math.max(0,player.inv-dt);let dx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),dy=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0),norm=Math.max(1,Math.hypot(dx+=touchX,dy+=touchY)),speed=270+player.speed*60;player.x=Math.max(24,Math.min(960,player.x+dx/norm*speed*dt));player.y=Math.max(65,Math.min(475,player.y+dy/norm*speed*dt));history.unshift({x:player.x,y:player.y});if(history.length>48)history.pop();shotCD-=dt;if((keys.KeyZ||keys.Space||autoFire)&&shotCD<=0){sound.effect(player.weapon==='laser'?'laser':'shot');fire(player.x,player.y);for(let i=0;i<player.option;i++){const p=optionPosition(i);fire(p.x,p.y,true)}shotCD=.13}
spawnCD-=dt;if(time<90&&spawnCD<=0){let y=95+Math.random()*340;for(let i=0;i<(stage===2?6:4);i++)enemies.push({x:1050+i*48,y,base:y,age:-i*.25,hp:stage===2?4:2,r:16,red:i===(stage===2?5:3),cd:1.5+Math.random()});spawnCD=(stage===2?1.9:2.8)-Math.min(stage===2?.6:1,time/90)}
if(time>=90&&!bossMade){bossMade=true;boss={x:1120,y:270,hp:stage===2?620:260,max:stage===2?620:260,cd:1,r:64,volley:0};enemies=[];bullets=[]}
for(const e of enemies){e.x-=(145+time*.45+(stage===2?55:0))*dt;e.age+=dt;e.y=e.base+Math.sin(e.age*3)*48;e.cd-=dt;if(e.cd<=0&&e.x<930&&e.x>player.x){enemyBullet(e.x,e.y,160+time*.35+(stage===2?45:0));if(stage===2&&e.red){enemyBullet(e.x,e.y,205,-.2);enemyBullet(e.x,e.y,205,.2);}e.cd=stage===2?2:2.8}if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+12)hit()}
if(boss){boss.x=Math.max(835,boss.x-100*dt);boss.y=270+Math.sin(time*1.3)*135;boss.cd-=dt;if(boss.cd<=0){const fan=stage===2?3:2;for(let i=-fan;i<=fan;i++)enemyBullet(boss.x-48,boss.y,stage===2?245:210,i*.18);boss.volley++;if(stage===2&&boss.volley%3===0){for(let i=0;i<12;i++){const a=i*Math.PI/6;bullets.push({x:boss.x-48,y:boss.y,vx:Math.cos(a)*160,vy:Math.sin(a)*160,r:5});}}boss.cd=stage===2?(boss.hp<250?.65:.85):(boss.hp<100?.65:1)}if(Math.hypot(boss.x-player.x,boss.y-player.y)<75)hit()}
for(const s of shots){s.life-=dt;if(s.kind==='missile'){
