<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>STARWING — ローカルシューティング</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#17294a 0%,#070c18 65%);color:#dceaff;font:15px system-ui,sans-serif;display:grid;min-height:100vh;place-items:center}main{width:min(1100px,96vw)}header{display:flex;align-items:center;justify-content:space-between;margin:20px 0}h1{font-size:24px;letter-spacing:6px;margin:0}small{color:#8295b5}button{background:#14243d;color:#cceaff;border:1px solid #335476;border-radius:6px;padding:10px 18px;cursor:pointer}canvas{display:block;width:100%;background:#060b18;border:1px solid #3e6383;border-radius:12px;box-shadow:0 24px 80px #0009,0 0 40px #249bdb12}footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;line-height:2;margin:14px 0;color:#9fb3cc}kbd{color:white;background:#20324d;padding:3px 6px;border-radius:4px}
html{min-height:100%;overscroll-behavior:none}body{min-height:100svh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}button{min-height:44px;touch-action:manipulation}canvas{height:auto}.mobile-controls{display:none;align-items:center;justify-content:space-between;gap:16px;padding:10px 14px;user-select:none;-webkit-user-select:none}.touch-help{display:none;color:#a8c2dd;font-size:12px;margin:7px 0}.stick{width:130px;height:130px;flex:0 0 130px;border-radius:50%;position:relative;touch-action:none;background:radial-gradient(circle,#274963aa,#0d1a31);border:1px solid #456781;box-shadow:inset 0 0 24px #05101e}.stick:before{content:'＋';position:absolute;inset:0;display:grid;place-items:center;font-size:55px;color:#82b0c83b}.knob{position:absolute;left:calc(50% - 25px);top:calc(50% - 25px);width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#98d7ed,#2a6188);box-shadow:0 5px 15px #0007;pointer-events:none}.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;max-width:240px}.actions button{font-weight:bold;min-width:100px}.actions .power{background:#b97529;color:#fff4df;border-color:#ffbd62}.actions .power:disabled{background:#243246;color:#8da1ba;border-color:#3b4c60}.mobile-controls button{touch-action:none}

</style><main><header><div><h1>STARWING</h1><small>VISUAL EDITION / THE AZURE RIFT</small></div><button id="start">開始 / リトライ</button></header><canvas id="screen" width="1000" height="560" aria-label="横スクロールシューティングゲーム"></canvas><p class="touch-help">横持ち推奨 ｜ 左パッドで移動・自動連射 ｜ カプセル取得後に「強化」</p><div class="mobile-controls"><div class="stick" id="stick" role="group" aria-label="移動パッド"><div class="knob" id="knob"></div></div><div class="actions"><button class="power" id="power" disabled>強化 —</button><button id="pause">一時停止</button><button id="auto" aria-pressed="true">自動連射 ON</button></div></div><footer><span><kbd>↑↓←→</kbd> / WASD 移動　<kbd>Z</kbd> / Space 連射　<kbd>X</kbd> 強化　<kbd>P</kbd> 一時停止</span><span>カプセルで強化枠を選択 → Xで装備。約90秒後にボス出現。</span></footer></main><script>
'use strict';
const canvas=document.getElementById('screen'),g=canvas.getContext('2d'),keys={};
let state='title',time=0,score=0,lives=3,charge=0,shotCD=0,spawnCD=0,boss=null,bossMade=false,player,shots=[],enemies=[],bullets=[],caps=[],particles=[],history=[],best=0;
try{best=Number(localStorage.getItem('starwing-best'))||0}catch{}
const stars=Array.from({length:100},()=>({x:Math.random()*1000,y:Math.random()*560,z:Math.random()*2+.3}));
const names=['SPEED','MISSILE','DOUBLE','LASER','OPTION','SHIELD'];
function reset(){releaseStick();time=0;score=0;lives=3;charge=0;shotCD=0;spawnCD=1;boss=null;bossMade=false;shots=[];enemies=[];bullets=[];caps=[];particles=[];history=[];player={x:140,y:280,speed:0,missile:false,double:false,laser:false,option:false,shield:0,inv:2};state='play'}
const stick=document.getElementById('stick'),knob=document.getElementById('knob'),powerButton=document.getElementById('power'),pauseButton=document.getElementById('pause'),autoButton=document.getElementById('auto');
let touchX=0,touchY=0,stickPointer=null,autoFire=matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0;
function releaseStick(){touchX=touchY=0;stickPointer=null;knob.style.transform='translate(0px,0px)'}
function moveStick(e){if(e.pointerId!==stickPointer)return;const r=stick.getBoundingClientRect(),radius=r.width*.32;let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,len=Math.hypot(x,y);if(len>radius){x*=radius/len;y*=radius/len}touchX=Math.abs(x)<4?0:x/radius;touchY=Math.abs(y)<4?0:y/radius;knob.style.transform=`translate(${x}px,${y}px)`}
stick.addEventListener('pointerdown',e=>{if(stickPointer!==null)return;e.preventDefault();stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer){e.preventDefault();moveStick(e)}});
for(const type of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(type,e=>{if(e.pointerId===stickPointer)releaseStick()});
function togglePause(){if(state==='play')state='pause';else if(state==='pause')state='play';releaseStick();syncControls()}
function syncControls(){powerButton.disabled=state!=='play'||!charge;powerButton.textContent=charge?'強化 '+names[charge-1]:'強化 —';pauseButton.textContent=state==='pause'?'再開':'一時停止';pauseButton.disabled=state!=='play'&&state!=='pause';autoButton.textContent='自動連射 '+(autoFire?'ON':'OFF');autoButton.setAttribute('aria-pressed',String(autoFire))}
powerButton.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='play'){upgrade();syncControls()}});
pauseButton.onclick=togglePause;autoButton.onclick=()=>{autoFire=!autoFire;syncControls()};
document.addEventListener('visibilitychange',()=>{if(document.hidden){releaseStick();Object.keys(keys).forEach(k=>delete keys[k]);if(state==='play')state='pause';syncControls()}});
addEventListener('resize',releaseStick);
document.getElementById('start').onclick=reset;
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.repeat)return;if(e.code==='Enter'&&state!=='play')reset();if(e.code==='KeyP')togglePause();if(e.code==='KeyX'&&state==='play')upgrade()});
addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>{releaseStick();Object.keys(keys).forEach(k=>delete keys[k]);if(state==='play')state='pause'});
function upgrade(){if(!charge)return;switch(charge){case 1:player.speed=Math.min(3,player.speed+1);break;case 2:player.missile=true;break;case 3:player.double=true;player.laser=false;break;case 4:player.laser=true;player.double=false;break;case 5:player.option=true;break;case 6:player.shield=3;break}charge=0}
function burst(x,y,color,n=18){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=Math.random()*180+30;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5+Math.random()*.4,color})}}
function hit(){if(player.inv>0||state!=='play')return;burst(player.x,player.y,'#7ceaff');player.inv=2;if(player.shield>0){player.shield--;return}lives--;if(lives<=0){finish('over');return}player.x=140;player.y=280;player.speed=Math.max(0,player.speed-1);bullets=[]}
function finish(s){state=s;best=Math.max(best,score);try{localStorage.setItem('starwing-best',best)}catch{}}
function fire(x,y){shots.push({x:x+20,y,vx:700,vy:0,r:player.laser?5:3,damage:player.laser?2:1,len:player.laser?65:17});if(player.double)shots.push({x:x+10,y:y-8,vx:570,vy:-230,r:3,damage:1,len:17});if(player.missile)shots.push({x,y:y+12,vx:360,vy:180,r:4,damage:2,len:12})}
function enemyBullet(x,y,speed,offset=0){let a=Math.atan2(player.y-y,player.x-x)+offset;bullets.push({x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,r:5})}
function update(dt){time+=dt;player.inv=Math.max(0,player.inv-dt);let dx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),dy=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0),norm=Math.max(1,Math.hypot(dx+=touchX,dy+=touchY)),speed=270+player.speed*60;player.x=Math.max(24,Math.min(960,player.x+dx/norm*speed*dt));player.y=Math.max(65,Math.min(475,player.y+dy/norm*speed*dt));history.unshift({x:player.x,y:player.y});if(history.length>28)history.pop();shotCD-=dt;if((keys.KeyZ||keys.Space||autoFire)&&shotCD<=0){fire(player.x,player.y);if(player.option){let p=history[history.length-1];fire(p.x-40,p.y)}shotCD=.13}
spawnCD-=dt;if(time<90&&spawnCD<=0){let y=95+Math.random()*340;for(let i=0;i<4;i++)enemies.push({x:1050+i*48,y,base:y,age:-i*.25,hp:2,r:16,red:i===3,cd:1.5+Math.random()});spawnCD=2.8-Math.min(1,time/90)}
if(time>=90&&!bossMade){bossMade=true;boss={x:1120,y:270,hp:260,max:260,cd:1,r:64};enemies=[];bullets=[]}
for(const e of enemies){e.x-=(145+time*.45)*dt;e.age+=dt;e.y=e.base+Math.sin(e.age*3)*48;e.cd-=dt;if(e.cd<=0&&e.x<930&&e.x>player.x){enemyBullet(e.x,e.y,160+time*.35);e.cd=2.8}if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+12)hit()}
if(boss){boss.x=Math.max(835,boss.x-100*dt);boss.y=270+Math.sin(time*1.3)*135;boss.cd-=dt;if(boss.cd<=0){for(let i=-2;i<=2;i++)enemyBullet(boss.x-48,boss.y,210,i*.18);boss.cd=boss.hp<100?.65:1}if(Math.hypot(boss.x-player.x,boss.y-player.y)<75)hit()}
for(const s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;for(const e of enemies){if(e.hp>0&&Math.abs(s.x-e.x)<e.r+s.len/2&&Math.abs(s.y-e.y)<e.r+s.r){e.hp-=s.damage;s.dead=true;if(e.hp<=0){score+=100;burst(e.x,e.y,e.red?'#ffbc5b':'#47bfff');if(e.red)caps.push({x:e.x,y:e.y})}break}}if(!s.dead&&boss&&Math.abs(s.x-boss.x)<60+s.len/2&&Math.abs(s.y-boss.y)<62){boss.hp-=s.damage;s.dead=true;burst(s.x,s.y,'#ffa96e',2);if(boss.hp<=0){burst(boss.x,boss.y,'#ffcc77',100);score+=5000;boss=null;finish('clear')}}}
for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;if(Math.hypot(b.x-player.x,b.y-player.y)<b.r+9){b.dead=true;hit()}}
for(const c of caps){c.x-=90*dt;if(Math.hypot(c.x-player.x,c.y-player.y)<27){c.dead=true;charge=charge%6+1;score+=50;burst(c.x,c.y,'#ffcf70',8)}}
shots=shots.filter(s=>!s.dead&&s.x<1100&&s.y<505&&s.y>42);enemies=enemies.filter(e=>e.hp>0&&e.x>-40);bullets=bullets.filter(b=>!b.dead&&b.x>-20&&b.x<1050&&b.y>40&&b.y<505);caps=caps.filter(c=>!c.dead&&c.x>-20);
for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0)}
function text(t,x,y,size=16,color='#dbeaff',align='left'){g.fillStyle=color;g.font=`${size}px system-ui`;g.textAlign=align;g.fillText(t,x,y)}
// All artwork is drawn locally: no textures or network requests.
function poly(points,fill,stroke){g.beginPath();points.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=1;g.stroke()}}
function glow(x,y,r,color){const grad=g.createRadialGradient(x,y,0,x,y,r);grad.addColorStop(0,color);grad.addColorStop(1,'transparent');g.fillStyle=grad;g.fillRect(x-r,y-r,r*2,r*2)}
const sky=document.createElement('canvas');sky.width=1600;sky.height=560;
{const c=sky.getContext('2d');c.fillStyle='#030916';c.fillRect(0,0,1600,560);for(let i=0;i<75;i++){let x=i*25,y=210+Math.sin(i*.12)*110,r=70+Math.random()*130;let h=c.createRadialGradient(x,y,0,x,y,r);h.addColorStop(0,i%3?'rgba(20,96,153,.12)':'rgba(105,40,161,.14)');h.addColorStop(1,'transparent');c.fillStyle=h;c.fillRect(x-r,y-r,r*2,r*2)}for(let i=0;i<450;i++){c.fillStyle=`rgba(180,217,255,${Math.random()*.45})`;c.fillRect(Math.random()*1600,Math.random()*560,1,1)}}
const planet=document.createElement('canvas');planet.width=400;planet.height=400;
{const c=planet.getContext('2d');let halo=c.createRadialGradient(200,200,145,200,200,195);halo.addColorStop(0,'#4fb9ff88');halo.addColorStop(.35,'#3389e533');halo.addColorStop(1,'transparent');c.fillStyle=halo;c.fillRect(0,0,400,400);c.save();c.beginPath();c.arc(200,200,153,0,Math.PI*2);c.clip();let body=c.createLinearGradient(60,80,330,300);body.addColorStop(0,'#7cbfd4');body.addColorStop(.4,'#235e83');body.addColorStop(1,'#071226');c.fillStyle=body;c.fillRect(0,0,400,400);for(let i=0;i<65;i++){c.beginPath();let y=55+i*4.5;for(let x=30;x<370;x+=5){let yy=y+Math.sin(x*.025+i*.24)*9+Math.sin(x*.065+i)*3;x===30?c.moveTo(x,yy):c.lineTo(x,yy)}c.strokeStyle=i%4?'#b4dce717':'#b4dce747';c.lineWidth=2+Math.random()*5;c.stroke()}let shadow=c.createRadialGradient(115,100,30,155,150,250);shadow.addColorStop(0,'transparent');shadow.addColorStop(.5,'#03102022');shadow.addColorStop(1,'#020611');c.fillStyle=shadow;c.fillRect(0,0,400,400);c.restore()}
function ship(x,y,option=false){g.save();g.translate(x,y);if(option)g.scale(.7,.7);let flame=30+Math.random()*16;glow(-22,0,34,option?'#ffb94766':'#25caff66');poly([[-12,-6],[-flame-22,0],[-12,6]],option?'#ff804b55':'#249dff66');poly([[-13,-3],[-flame,0],[-13,3]],'#a5f7ff');let hull=g.createLinearGradient(0,-19,0,19);hull.addColorStop(0,'#edf6ff');hull.addColorStop(.45,option?'#fbc469':'#91b9d4');hull.addColorStop(.5,'#335574');hull.addColorStop(1,'#16293e');poly([[-19,-7],[-25,-22],[-12,-20],[6,-8],[28,-2],[32,0],[28,2],[6,8],[-12,20],[-25,22],[-19,7]],hull,'#a9d6ed');poly([[-16,-5],[6,-6],[28,0],[6,6],[-16,5]],'#b4d4e4','#7193ad');poly([[-4,-4],[9,-3],[17,0],[5,3],[-5,2]],'#11314c');poly([[-2,-3],[7,-2],[12,0],[-2,0]],'#5fe4ff');g.fillStyle='#ff7654';g.fillRect(-17,-18,7,3);g.fillRect(-17,15,7,3);g.fillStyle='#142a40';g.fillRect(-20,-10,12,3);g.fillRect(-20,7,12,3);g.fillStyle='#c0faff';g.fillRect(-16,-10,4,2);g.fillRect(-16,8,4,2);g.restore()}
function enemyArt(e){g.save();g.translate(e.x,e.y);let color=e.red?'#ff9659':'#a994ff';glow(10,0,24,e.red?'#ff63353b':'#8d64ff33');let armor=g.createLinearGradient(0,-19,0,19);armor.addColorStop(0,e.red?'#d78b65':'#9a98c9');armor.addColorStop(.5,'#3b3555');armor.addColorStop(1,'#181c30');poly([[-24,0],[-9,-8],[-2,-20],[15,-15],[8,-4],[20,0],[8,4],[15,15],[-2,20],[-9,8]],armor,color);poly([[-17,0],[-3,-7],[10,0],[-3,7]],'#211b36','#79708b');glow(-7,0,12,color+'88');g.fillStyle=color;g.beginPath();g.ellipse(-7,0,6,3,0,0,7);g.fill();g.fillStyle='#e9dfff';g.fillRect(-11,-1,6,2);g.restore()}
function bossArt(){g.save();g.translate(boss.x,boss.y);glow(25,0,110,'#9f51ff22');let metal=g.createLinearGradient(0,-75,0,75);metal.addColorStop(0,'#95a5ba');metal.addColorStop(.25,'#3c506c');metal.addColorStop(.5,'#172d49');metal.addColorStop(.8,'#445878');metal.addColorStop(1,'#111d32');poly([[-63,-46],[3,-60],[48,-82],[82,-52],[98,0],[82,52],[48,82],[3,60],[-63,46],[-36,23],[-36,-23]],metal,'#809ec4');for(let side of [-1,1]){g.save();g.scale(1,side);poly([[-69,34],[-20,38],[23,57],[60,54],[41,77],[-7,62],[-68,58]],'#293d58','#607a98');g.fillStyle='#0c1424';g.fillRect(-65,40,42,11);g.fillStyle='#ff8263';g.fillRect(-65,43,22,4);for(let i=0;i<4;i++){g.fillStyle='#6180a0';g.fillRect(31+i*8,22,3,18)}g.restore()}g.strokeStyle='#9e9ad5';g.lineWidth=6;g.beginPath();g.arc(0,0,34,0,7);g.stroke();g.strokeStyle='#273752';g.lineWidth=9;g.beginPath();g.arc(0,0,43,.45,5.8);g.stroke();glow(0,0,50,'#ff734d99');const core=g.createRadialGradient(-5,-5,1,0,0,26);core.addColorStop(0,'#fff8db');core.addColorStop(.35,'#ffc574');core.addColorStop(1,'#e53962');g.fillStyle=core;g.beginPath();g.arc(0,0,23+Math.sin(time*8)*2,0,7);g.fill();g.strokeStyle='#fff0bc88';g.lineWidth=1;g.beginPath();g.arc(0,0,29, time*2,time*2+4);g.stroke();g.restore()}
function draw(dt){g.fillStyle='#060c1b';g.fillRect(0,0,1000,560);let bgOffset=(time*8)%1600;g.drawImage(sky,-bgOffset,0);g.drawImage(sky,1600-bgOffset,0);g.drawImage(planet,600-time*1.6,35,360,360);for(const s of stars){if(state==='play'||state==='title'){s.x-=s.z*35*dt;if(s.x<0)s.x=1000}g.fillStyle=`rgba(160,205,255,${s.z/3})`;g.fillRect(s.x,s.y,s.z,s.z)}
g.strokeStyle='#12314b';for(let row=0;row<2;row++){g.beginPath();for(let x=0;x<=1000;x+=20){let y=row?495+Math.sin(x*.013+time*.7)*10:48+Math.sin(x*.013+time*.7)*7;x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}
for(const c of caps){g.fillStyle='#ffbd56';g.shadowBlur=14;g.shadowColor='#ffa83a';g.fillRect(c.x-9,c.y-9,18,18);g.shadowBlur=0;text('C',c.x,c.y+5,13,'#372107','center')}
for(const e of enemies)enemyArt(e);
if(boss){bossArt();g.fillStyle='#302238';g.fillRect(300,55,400,5);g.fillStyle='#ff7974';g.fillRect(300,55,400*boss.hp/boss.max,5)}
for(const s of shots){g.shadowBlur=s.len>20?18:8;g.shadowColor=s.len>20?'#42fff3':'#6ccaff';g.fillStyle=s.len>20?'#58eadd':'#65bbff';g.fillRect(s.x-s.len/2,s.y-s.r,s.len,s.r*2);g.fillStyle='#e5ffff';g.fillRect(s.x-s.len/2,s.y-1,s.len,2);g.shadowBlur=0}
for(const b of bullets){g.shadowBlur=12;g.shadowColor='#ff306b';g.fillStyle='#ff477e';g.beginPath();g.arc(b.x,b.y,b.r+1,0,7);g.fill();g.shadowBlur=0;g.fillStyle='#ffe5ef';g.beginPath();g.arc(b.x,b.y,2,0,7);g.fill()}
